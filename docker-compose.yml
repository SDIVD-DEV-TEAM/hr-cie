version: "3.9"
services:
  web:
    image: dstdcie17/hr-api-cie:1.1
    container_name: hr-api-cie
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5435/hr_db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_GENERATE_DDL=true
    ports:
      - "8090:8090"
    links:
      - "db:db"
  db:
    container_name: hr-postgres-db
    image: postgres:15.2
    ports:
      - "5435:5432"
    environment:
      - "POSTGRES_PASSWORD=postgres"
